# Pets Eden - Netlify configuration
# Place this file at the ROOT of the repo (same level as index.html).

# ---------------------------------------------------------------
# Public site: every page
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    # Google Tag Manager (container GTM-PRX4G6PZ), Google Analytics and
    # Google Ads conversion tracking (AW-958436335).
    #
    # The Google Ads domains follow Google's published CSP list at
    # developers.google.com/tag-platform/security/guides/csp, plus
    # googleads.g.doubleclick.net in script-src, which that list omits but
    # which the conversion script is actually served from.
    #
    # Google serves conversion pings from the visitor's local Google domain
    # and each one must be listed separately, so .com and .com.sg are here.
    # If Tag Assistant later reports a blocked request to another
    # www.google.<TLD>, add that domain to img-src and connect-src.
    #
    # The sha256 value is the fingerprint of the small inline gtag block in
    # the <head> of every page: if that snippet is edited by even one
    # character, the hash must be regenerated or analytics stops collecting.
    Content-Security-Policy = """\
default-src 'none'; \
script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.com.sg 'sha256-jYHg7tXSuuVUqjy+JeRT8vyG97+Spkw5IFHdQEBbmrw='; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src https://fonts.gstatic.com; \
img-src 'self' data: https://static.wixstatic.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.com.sg; \
connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://tagassistant.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://ad.doubleclick.net https://www.google.com https://www.google.com.sg; \
frame-src https://pets-eden-crm.netlify.app https://www.googletagmanager.com https://tagassistant.google.com https://td.doubleclick.net https://bid.g.doubleclick.net; \
manifest-src 'self'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'; \
object-src 'none'; \
upgrade-insecure-requests"""

# ---------------------------------------------------------------
# Decap CMS admin (/admin/) needs more room: CMS script from unpkg,
# Netlify Identity widget, GitHub/Netlify APIs, and inline script/styles.
# Kept to /admin/* only so the public site stays strict.
# ---------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; \
font-src 'self' data: https://fonts.gstatic.com; \
img-src 'self' data: blob: https:; \
connect-src 'self' https://api.github.com https://api.netlify.com https://identity.netlify.com https://unpkg.com; \
frame-src 'self' blob: https://identity.netlify.com; \
worker-src 'self' blob:; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'self'; \
object-src 'none'"""

# ---------------------------------------------------------------
# The cat course page used to live at a misspelled address
# (/professioanl-cat-groomer-course/). It has been renamed, so the old
# address is permanently redirected: anyone arriving from Google, an old
# bookmark or a shared link still lands on the right page.
# ---------------------------------------------------------------
[[redirects]]
  from = "/professioanl-cat-groomer-course/*"
  to = "/professional-cat-groomer-course/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/professioanl-cat-groomer-course"
  to = "/professional-cat-groomer-course/"
  status = 301
  force = true
